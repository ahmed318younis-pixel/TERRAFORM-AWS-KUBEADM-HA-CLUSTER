apiVersion: v1
kind: PersistentVolume
metadata:
  name: vprofile-rabbitmq-pv
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: vprofile
spec:
  capacity:
    storage: 5Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain
  storageClassName: vprofile-local
  volumeMode: Filesystem

  claimRef:
    namespace: vprofile
    name: rabbitmq-data

  local:
    path: /var/lib/vprofile/rabbitmq

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-01
