apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: vprofile
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: vprofile

spec:
  serviceName: database-headless
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/part-of: vprofile

    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01

      terminationGracePeriodSeconds: 60

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: fix-mariadb-permissions
          image: docker.io/library/busybox:1.37
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c
            - |
              echo "Preparing MariaDB data directory..."
              chown -R 999:999 /var/lib/mysql
              chmod -R u+rwX,g+rwX,o-rwx /var/lib/mysql
              echo "MariaDB data directory is ready."

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql

      containers:
        - name: mariadb
          image: mokhattab/vprofile-db:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: DB_ROOT_PASSWORD

            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: DB_NAME

            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: DB_USER

            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: DB_PASSWORD

          securityContext:
            allowPrivilegeEscalation: false

          startupProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi

          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data
