apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  namespace: vprofile
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/part-of: vprofile

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: memcached

  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        app.kubernetes.io/part-of: vprofile

    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01

      terminationGracePeriodSeconds: 30

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: memcached
          image: mokhattab/vprofile-memcached:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: memcached
              containerPort: 11211
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            runAsUser: 11211
            runAsGroup: 11211
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: memcached
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
